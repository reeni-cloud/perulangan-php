<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CBT Perulangan PHP — XI RPL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   PENGATURAN UJIAN — guru boleh mengubah bagian ini dengan Notepad
   ===================================================================== */
window.CBT_CONFIG = {
  judul: 'Latihan Soal: Perulangan PHP',
  mapel: 'Pemrograman Web',
  sekolah: '',                                  // contoh: 'SMK Negeri ...'
  kelasList: ['XI RPL'],
  durasiMenit: 90,
  token: 'LOOP46',                              // token yang dibacakan guru saat ujian dimulai
  pinGuru: '4646',                              // PIN untuk membuka Mode Guru
  kkm: 78,
  tampilkanNilai: true,                         // false = siswa tidak melihat nilainya
  acakSoal: true,                               // urutan soal diacak per siswa (di dalam tiap bagian)
  acakOpsi: true,                               // urutan pilihan a–e diacak per siswa
  bobot: { A: 2, B: 3, C: 5 }                   // 20×2 + 10×3 + 6×5 = 100
};
</script>
<style>
:root {
  --navy: #1d2462; --navy-2: #28307a; --cyan: #0b7fa8; --amber: #f2b418;
  --bg: #f4f6fb; --card: #ffffff; --panel: #eef3fc; --line: #d3ddf0; --text: #1a1f3d; --muted: #58617f;
  --ok: #17865c; --ok-bg: #e3f5ec; --bad: #c73b3b; --bad-bg: #fdecec; --warn: #9a6400; --warn-bg: #fff3d6;
  --code-bg: #111827; --code-line: #1f2a3d; --code-text: #e5e9f0;
  --serif: "Source Serif 4", Cambria, Georgia, serif; --sans: "Source Sans 3", Calibri, "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0c1030; --card: #151b44; --panel: #1b2250; --line: #2e3772; --text: #e6e9f7; --muted: #a3abd0; --cyan: #56c6ee; --ok: #4cd39a; --ok-bg: #11332a; --bad: #ff8a8a; --bad-bg: #3a1a26; --warn: #ffcf66; --warn-bg: #332a12; --code-bg: #0a0f1f; --code-line: #1a2238; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0c1030; --card: #151b44; --panel: #1b2250; --line: #2e3772; --text: #e6e9f7; --muted: #a3abd0; --cyan: #56c6ee; --ok: #4cd39a; --ok-bg: #11332a; --bad: #ff8a8a; --bad-bg: #3a1a26; --warn: #ffcf66; --warn-bg: #332a12; --code-bg: #0a0f1f; --code-line: #1a2238; color-scheme: dark; }
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
code { font-family: var(--mono); font-size: .88em; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 .3em; }
.hide { display: none !important; }
.btn { border: 0; border-radius: 9px; padding: 10px 18px; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--navy-2); }
.btn-amber { background: var(--amber); color: #1d2140; }
.btn-line { background: var(--card); border: 1.5px solid var(--line); color: var(--text); }
.btn-line:hover { border-color: var(--cyan); }
.btn-danger { background: var(--bad); color: #fff; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; color: var(--cyan); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; }

/* ---------- login ---------- */
.login { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.login-side { background: var(--navy); color: #eef1fb; padding: 56px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
.login-side .school { color: var(--amber); font-weight: 700; letter-spacing: .02em; }
.login-side h1 { font-family: var(--serif); font-size: clamp(34px, 4vw, 52px); color: #fff; margin: 14px 0 12px; }
.login-side p { color: #c9d0ee; margin: 0; font-size: 18px; }
.facts { display: grid; grid-template-columns: repeat(3, auto); gap: 8px 36px; justify-content: start; }
.facts b { font-family: var(--serif); font-size: 34px; color: #fff; display: block; line-height: 1.1; }
.facts span { color: #c9d0ee; font-size: 15px; }
.rules { background: rgba(255,255,255,.06); border-radius: 12px; padding: 18px 22px; font-size: 15.5px; color: #dfe4fa; }
.rules ol { margin: 8px 0 0; padding-left: 20px; }
.rules li { margin: 3px 0; }
.login-form { display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
.form { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }
.form h2 { font-family: var(--serif); font-size: 30px; color: var(--navy); }
:root[data-theme="dark"] .form h2 { color: #dfe4ff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .form h2 { color: #dfe4ff; } }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-weight: 700; font-size: 15px; }
.field input, .field select { border: 1.5px solid var(--line); background: var(--card); border-radius: 9px; padding: 11px 13px; }
.field input:focus, .field select:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cyan) 25%, transparent); }
.row2 { display: grid; grid-template-columns: 1fr 120px; gap: 12px; }
.err { color: var(--bad); font-weight: 600; font-size: 15px; min-height: 1.4em; }
.form .btn-primary { padding: 13px; font-size: 17px; }
.form-foot { display: flex; justify-content: space-between; align-items: center; font-size: 14.5px; color: var(--muted); }

/* ---------- exam ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--navy); color: #fff; }
.topbar-in { max-width: 1320px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 16px; }
.topbar .title { font-weight: 700; font-size: 16px; }
.topbar .who { color: #c9d0ee; font-size: 14.5px; }
.topbar .sp { flex: 1; }
.timer { font-family: var(--mono); font-weight: 600; font-size: 20px; background: rgba(255,255,255,.1); padding: 5px 14px; border-radius: 8px; font-variant-numeric: tabular-nums; }
.timer.low { background: var(--amber); color: #1d2140; }
.timer.crit { background: #e04848; color: #fff; }
.btn-nav-toggle { display: none; background: rgba(255,255,255,.12); color: #fff; }
.exam { max-width: 1320px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.qcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 26px 28px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.qhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.qnum { font-family: var(--serif); font-weight: 700; font-size: 26px; color: var(--navy); }
:root[data-theme="dark"] .qnum { color: #dfe4ff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .qnum { color: #dfe4ff; } }
.chip { font-size: 14px; font-weight: 700; padding: 3px 11px; border-radius: 99px; background: var(--panel); color: var(--cyan); }
.chip.pts { color: var(--muted); font-weight: 600; }
.qtext { font-size: 19px; margin: 0; }
.codeblk { background: var(--code-bg); color: var(--code-text); border-radius: 10px; padding: 16px 18px; font-family: var(--mono); font-size: 15px; line-height: 1.65; white-space: pre; overflow-x: auto; margin: 0; user-select: none; -webkit-user-select: none; }
.t-kw { color: #6cb6ff; } .t-var { color: #9ddcff; } .t-str { color: #f0a868; } .t-num { color: #b5d99c; } .t-com { color: #6a9955; font-style: italic; } .t-tag { color: #c792ea; } .t-fn { color: #e5d17d; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 11px; padding: 12px 16px; font-size: 17.5px; }
.opt:hover { border-color: var(--cyan); }
.opt .ltr { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 700; flex: none; text-transform: uppercase; }
.opt[aria-checked="true"] { border-color: var(--navy); background: var(--panel); }
.opt[aria-checked="true"] .ltr { background: var(--navy); border-color: var(--navy); color: #fff; }
:root[data-theme="dark"] .opt[aria-checked="true"] { border-color: var(--amber); }
:root[data-theme="dark"] .opt[aria-checked="true"] .ltr { background: var(--amber); border-color: var(--amber); color: #1d2140; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .opt[aria-checked="true"] { border-color: var(--amber); } :root:not([data-theme="light"]) .opt[aria-checked="true"] .ltr { background: var(--amber); border-color: var(--amber); color: #1d2140; } }
.ans-area { display: flex; flex-direction: column; gap: 6px; }
.ans-area label { font-weight: 700; }
.ans-area textarea { border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; padding: 12px 14px; font-family: var(--mono); font-size: 16px; resize: vertical; min-height: 64px; }
.ans-area textarea:focus { outline: none; border-color: var(--cyan); }
.ans-area small { color: var(--muted); font-size: 14.5px; }
.lbl { font-weight: 700; font-size: 15px; color: var(--cyan); display: block; margin-bottom: 6px; }
.outbox { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; font-family: var(--mono); font-size: 14.5px; line-height: 1.6; white-space: pre; overflow-x: auto; margin: 0; }
.reqs { margin: 0; padding-left: 20px; font-size: 16px; }
.win { background: var(--code-bg); border-radius: 12px; overflow: hidden; }
.win-top { display: flex; align-items: center; gap: 7px; padding: 10px 14px; border-bottom: 1px solid var(--code-line); }
.win-top i { width: 11px; height: 11px; border-radius: 50%; display: block; }
.win-top i:nth-child(1) { background: #ec5f55; } .win-top i:nth-child(2) { background: #f4bf3a; } .win-top i:nth-child(3) { background: #45c05a; }
.win-top span { margin-left: 8px; color: #8b95b0; font-family: var(--mono); font-size: 13px; }
.editor { display: grid; grid-template-columns: auto 1fr; height: 320px; }
.gutter { font-family: var(--mono); font-size: 14.5px; line-height: 1.65; color: #5b6685; text-align: right; padding: 14px 10px 14px 14px; user-select: none; overflow: hidden; background: #0d1422; min-width: 44px; }
.code-area { position: relative; overflow: hidden; }
.code-area pre, .code-area textarea { position: absolute; inset: 0; margin: 0; border: 0; padding: 14px 16px; font-family: var(--mono); font-size: 14.5px; line-height: 1.65; white-space: pre; overflow: auto; tab-size: 2; font-variant-ligatures: none; }
.code-area pre { color: var(--code-text); pointer-events: none; }
.code-area textarea { background: transparent; color: transparent; caret-color: #fff; resize: none; outline: none; -webkit-text-fill-color: transparent; }
.code-area textarea::selection { background: rgba(124,199,255,.3); }
.code-area textarea:focus-visible { box-shadow: inset 0 0 0 2px var(--amber); }
.win-bar { display: flex; gap: 8px; padding: 9px 12px; border-top: 1px solid var(--code-line); align-items: center; }
.win-bar .btn { padding: 8px 14px; font-size: 15px; }
.btn-run { background: #25304f; color: #e8ecf8; }
.btn-soft { background: transparent; color: #aab4cf; font-weight: 600; }
.win-bar .sp { flex: 1; }
.console { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.console pre { margin: 0; padding: 8px 14px 14px; font-family: var(--mono); font-size: 14.5px; line-height: 1.6; white-space: pre; overflow: auto; max-height: 220px; min-height: 48px; }
.console .empty { color: var(--muted); font-family: var(--sans); font-style: italic; }
.console .e { color: var(--bad); font-family: var(--sans); font-weight: 600; white-space: pre-wrap; display: block; }
.console .w { color: var(--warn); font-family: var(--sans); white-space: pre-wrap; display: block; font-size: 14.5px; }
.console-head { padding: 10px 14px 0; display: flex; justify-content: space-between; }
.console-head .lbl { margin: 0; }
.qfoot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
.qfoot .sp { flex: 1; }
.btn-ragu[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: #1d2140; }

.side { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 14px; }
.navcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.navcard h3 { font-size: 16px; }
.sec-lbl { font-size: 13.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.nb { aspect-ratio: 1; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: 14.5px; font-variant-numeric: tabular-nums; padding: 0; }
.nb.ans { background: var(--ok); border-color: var(--ok); color: #fff; }
.nb.ragu { background: var(--amber); border-color: var(--amber); color: #1d2140; }
.nb[aria-current="true"] { outline: 3px solid var(--navy); outline-offset: 1px; }
:root[data-theme="dark"] .nb[aria-current="true"] { outline-color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nb[aria-current="true"] { outline-color: #fff; } }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; border: 1.5px solid var(--line); }
.legend i.a { background: var(--ok); border-color: var(--ok); } .legend i.r { background: var(--amber); border-color: var(--amber); }
.progress { font-size: 15px; color: var(--muted); }
.progress b { color: var(--text); }

/* ---------- result ---------- */
.center { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
.result { background: var(--card); border: 1px solid var(--line); border-radius: 16px; max-width: 620px; width: 100%; padding: 32px; display: flex; flex-direction: column; gap: 18px; }
.result h2 { font-family: var(--serif); font-size: 30px; color: var(--navy); }
:root[data-theme="dark"] .result h2 { color: #dfe4ff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .result h2 { color: #dfe4ff; } }
.score-big { display: flex; align-items: baseline; gap: 12px; }
.score-big b { font-family: var(--serif); font-size: 72px; line-height: 1; color: var(--navy); font-variant-numeric: tabular-nums; }
:root[data-theme="dark"] .score-big b { color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .score-big b { color: #fff; } }
.badge { font-weight: 700; padding: 4px 12px; border-radius: 99px; font-size: 15px; }
.badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.no { background: var(--bad-bg); color: var(--bad); }
.parts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.parts div { background: var(--panel); border-radius: 10px; padding: 10px 14px; }
.parts span { font-size: 14px; color: var(--muted); display: block; }
.parts b { font-size: 20px; font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: 16px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; }
.sigcode { font-family: var(--mono); letter-spacing: .08em; }
.note { background: var(--warn-bg); border-radius: 10px; padding: 12px 16px; font-size: 15.5px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- teacher ---------- */
.tbar { background: var(--navy); color: #fff; }
.tbar-in { max-width: 1320px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.tbar h1 { font-size: 20px; }
.tbar .sp { flex: 1; }
.tbar .btn-line { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
.teach { max-width: 1320px; margin: 0 auto; padding: 22px 20px 48px; display: flex; flex-direction: column; gap: 20px; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tools select { border: 1.5px solid var(--line); background: var(--card); border-radius: 9px; padding: 9px 12px; }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.stat span { font-size: 14px; color: var(--muted); display: block; }
.stat b { font-family: var(--serif); font-size: 30px; font-variant-numeric: tabular-nums; }
.tablewrap { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
table.rekap { width: 100%; border-collapse: collapse; font-size: 15.5px; }
.rekap th { text-align: left; font-size: 14px; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
.rekap td { padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rekap tr.click { cursor: pointer; }
.rekap tr.click:hover td { background: var(--panel); }
.rekap td.num { text-align: right; }
.rekap .nilai { font-weight: 700; }
.tag { font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
.tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.no { background: var(--bad-bg); color: var(--bad); } .tag.w { background: var(--warn-bg); color: var(--warn); }
.empty-state { padding: 32px; text-align: center; color: var(--muted); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font-size: 19px; }
.panel p { margin: 0; color: var(--muted); font-size: 15px; }
.items { display: flex; flex-direction: column; gap: 5px; max-height: 520px; overflow-y: auto; }
.item { display: grid; grid-template-columns: 44px 1fr 52px; gap: 10px; align-items: center; font-size: 14.5px; }
.item .bar { height: 12px; background: var(--panel); border-radius: 6px; overflow: hidden; }
.item .bar i { display: block; height: 100%; background: var(--ok); }
.item .bar i.mid { background: var(--amber); } .item .bar i.lowb { background: var(--bad); }
.item b { font-family: var(--mono); font-size: 13.5px; }
.item span { text-align: right; font-variant-numeric: tabular-nums; }

.sheet { position: fixed; inset: 0; background: rgba(10,14,40,.55); z-index: 20; display: grid; place-items: center; padding: 20px; }
.sheet .card { background: var(--card); border-radius: 14px; max-width: 520px; width: 100%; max-height: 90%; overflow: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.sheet .card.wide { max-width: 900px; }
.sheet h3 { font-size: 22px; }
.sheet p { margin: 0; }
.sheet .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.det { display: flex; flex-direction: column; gap: 8px; }
.det .d { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.det .d header { display: flex; gap: 10px; align-items: center; }
.det .d pre { margin: 0; font-family: var(--mono); font-size: 13.5px; background: var(--panel); border-radius: 8px; padding: 8px 10px; white-space: pre; overflow-x: auto; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: #fff; padding: 12px 20px; border-radius: 10px; z-index: 30; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: 90vw; }

@media (max-width: 980px) {
  .login { grid-template-columns: 1fr; }
  .login-side { padding: 32px 24px; }
  .exam { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0; background: rgba(10,14,40,.55); z-index: 10; padding: 20px; display: none; align-items: center; justify-content: center; top: 0; }
  .side.open { display: flex; }
  .side .navcard { max-width: 420px; width: 100%; max-height: 90%; overflow: auto; }
  .btn-nav-toggle { display: inline-flex; }
  .stats { grid-template-columns: repeat(3, 1fr); }
  .two { grid-template-columns: 1fr; }
}

<script>
(function () {
'use strict';
const CFG = window.CBT_CONFIG;
const Q = window.CBT_Q;
const QMAP = Object.fromEntries(Q.map(q => [q.id, q]));
const SEC = { A: 'Pilihan ganda', B: 'Tebak output', C: 'Praktik koding' };

/* ---------- kunci (disamarkan) ---------- */
const KEY = (function () {
  const raw = atob(window.CBT_KEY); const k = 'rpl-loop'; let s = '';
  for (let i = 0; i < raw.length; i++) s += String.fromCharCode(raw.charCodeAt(i) ^ k.charCodeAt(i % k.length));
  return JSON.parse(decodeURIComponent(escape(s)));
})();

const REQ = {
  for: { label: 'Menggunakan perulangan for', test: s => s.forIter > 0 },
  while: { label: 'Menggunakan perulangan while', test: s => s.whileIter > 0 },
  foreach: { label: 'Menggunakan foreach', test: s => s.foreachIter > 0 },
  break: { label: 'break benar-benar dijalankan', test: s => s.breakCount > 0 },
  continue: { label: 'continue benar-benar dijalankan', test: s => s.continueCount > 0 },
  echoInLoop: { label: 'Output dicetak dari dalam perulangan', test: s => s.echoInLoop > 0 },
  nested: { label: 'Menggunakan perulangan bersarang', test: s => s.maxDepth >= 2 },
};

/* ---------- utilitas ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
function hash53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const fmtTime = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); };
const fmtDate = t => new Date(t).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
function toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status'); document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function hlCode(src) {
  const re = /(\/\*[\s\S]*?(?:\*\/|$)|\/\/[^\n]*|#[^\n]*)|("(?:\\[\s\S]|[^"\\])*"?|'(?:\\[\s\S]|[^'\\])*'?)|(\$[A-Za-z_]\w*)|(<\?php|\?>)|\b(\d+(?:\.\d+)?)\b|\b(for|foreach|while|do|as|if|else|elseif|break|continue|echo|print|true|false|null|switch|case|default|array)\b|\b([a-z_]\w*)(?=\s*\()/gi;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const cls = m[1] ? 't-com' : m[2] ? 't-str' : m[3] ? 't-var' : m[4] ? 't-tag' : m[5] ? 't-num' : m[6] ? 't-kw' : 't-fn';
    out += `<span class="${cls}">${esc(m[0])}</span>`; last = re.lastIndex; if (!m[0].length) re.lastIndex++;
  }
  return out + esc(src.slice(last)) + '\n';
}
const normOut = s => String(s).replace(/\r\n?/g, '\n').replace(/<br\s*\/?>/gi, '\n').split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/^\n+|\s+$/g, '');
const normIsian = s => String(s || '').replace(/^\s*["'`]|["'`]\s*$/g, '').replace(/\s+/g, ' ').trim();

async function saveFile(filename, text) {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({ filename, data: text }); toast('File disimpan'); return true; }
    }
  } catch (e) { if (e && e.code === 'declined') return false; }
  try {
    const blob = new Blob([text], { type: filename.endsWith('.csv') ? 'text/csv' : 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return true;
  } catch (e) { toast('Gagal menyimpan file'); return false; }
}

/* ---------- penilaian ---------- */
function grade(answers) {
  const det = {}; const sc = { A: 0, B: 0, C: 0 }; const max = { A: 0, B: 0, C: 0 };
  Q.forEach(q => {
    const w = CFG.bobot[q.sec]; max[q.sec] += w;
    const a = answers[q.id];
    let pts = 0, status = 'kosong', extra = null;
    if (q.type === 'pg') {
      if (a !== undefined && a !== null) { const ok = a === KEY[q.id]; pts = ok ? w : 0; status = ok ? 'benar' : 'salah'; }
    } else if (q.type === 'isian') {
      if (a && normIsian(a)) { const ok = normIsian(a) === normIsian(KEY[q.id]); pts = ok ? w : 0; status = ok ? 'benar' : 'salah'; }
    } else {
      const starterSame = !a || normOut(a) === normOut(q.starter);
      if (!starterSame) {
        const r = PHPMini.run(a, { maxSteps: 1500000 });
        const outOk = !r.error && normOut(r.output) === normOut(KEY[q.id]);
        const reqMiss = q.reqs.filter(k => !REQ[k].test(r.stats));
        if (outOk && !reqMiss.length) { pts = w; status = 'benar'; }
        else if (outOk) { pts = Math.round(w * 0.4); status = 'sebagian'; }
        else status = 'salah';
        extra = { output: r.output.slice(0, 2000), error: r.error ? r.error.msg + ' (baris ' + r.error.line + ')' : null, reqMiss };
      }
    }
    sc[q.sec] += pts; det[q.id] = { pts, status, extra };
  });
  const total = sc.A + sc.B + sc.C, maxT = max.A + max.B + max.C;
  return { sc, max, total, nilai: Math.round(total / maxT * 100), det };
}
const sigOf = r => hash53([r.siswa.nama, r.siswa.kelas, r.siswa.absen, r.mulai, r.selesai, JSON.stringify(r.jawaban), r.pelanggaran.keluar, CFG.token].join('|'), 46).toString(36).toUpperCase().slice(-8).padStart(8, '0');

let S = null, tick = null;
function startExam(siswa) {
  const r = rng(hash53(siswa.nama.toLowerCase() + '|' + siswa.kelas + '|' + siswa.absen + '|' + Date.now()));
  const order = [];
  ['A', 'B', 'C'].forEach(sec => { const ids = Q.filter(q => q.sec === sec).map(q => q.id); order.push(...(CFG.acakSoal ? shuffle(ids, r) : ids)); });
  const optOrder = {};
  Q.filter(q => q.type === 'pg').forEach(q => { const idx = q.o.map((_, i) => i); optOrder[q.id] = CFG.acakOpsi ? shuffle(idx, r) : idx; });
  S = { siswa, mulai: Date.now(), order, optOrder, jawaban: {}, ragu: {}, idx: 0, keluar: 0, tempel: 0, done: false };
  saveS();
  renderExam();
}
const saveS = () => store.set('cbt:sesi', S);
const remaining = () => CFG.durasiMenit * 60 - (Date.now() - S.mulai) / 1000;
const isAnswered = id => { const a = S.jawaban[id]; const q = QMAP[id]; if (q.type === 'pg') return a !== undefined && a !== null; if (q.type === 'isian') return !!(a && a.trim()); return !!a && normOut(a) !== normOut(q.starter); };

function closeNav() { $('#side').classList.remove('open'); $('#nav-close').classList.add('hide'); }
function go(i) { saveCurrent(); S.idx = Math.max(0, Math.min(S.order.length - 1, i)); saveS(); renderQ(); refreshNav(); window.scrollTo({ top: 0 }); }

function refreshNav() {
  let ans = 0, ragu = 0;

let escArmed = false, saveTimer = null;
function syncEditor() {
  const ta = $('#code'); if (!ta) return;

}
function syncScroll() { const ta = $('#code'), hl = $('#hl'); if (!ta) return; hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; $('#gutter').scrollTop = ta.scrollTop; }
function setupEditor(ta) {
  syncEditor(); guardPaste(ta);
  ta.addEventListener('input', () => { syncEditor(); clearTimeout(saveTimer); saveTimer = setTimeout(() => { S.jawaban[S.order[S.idx]] = ta.value; saveS(); refreshNav(); }, 300); });
  ta.addEventListener('scroll', syncScroll);

    const v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
    if (e.key === 'Escape') { escArmed = true; return; }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runCode(); return; }
    if (e.key === 'Tab') {
      if (escArmed) { escArmed = false; return; }

      const ls = v.lastIndexOf('\n', s - 1) + 1;
      if (e.shiftKey || s !== en) {
        const le = v.indexOf('\n', en - (en > s && v[en - 1] === '\n' ? 1 : 0)); const end = le < 0 ? v.length : le;
        const nb = v.slice(ls, end).split('\n').map(l => e.shiftKey ? l.replace(/^ {1,2}/, '') : '  ' + l).join('\n');

      return;
    }

      body = `<div>Jawaban: <b>${answerText(q, a)}</b>${d.status !== 'benar' ? ` · Kunci: ${kunci}` : ''}</div>`;
    }
    return `<div class="d"><header><b>${q.id}</b>${tagOf(d.status)}<span style="color:var(--muted);font-size:14px">${d.pts}/${CFG.bobot[q.sec]} poin</span></header>${body}</div>`;
  }).join('');
  openSheet(`<h3 id="sh-t">${esc(r.siswa.nama)} · ${esc(r.siswa.kelas)} · Absen ${esc(r.siswa.absen)}</h3>
    <p>Nilai <b>${g.nilai}</b> (A ${g.sc.A}/${g.max.A}, B ${g.sc.B}/${g.max.B}, C ${g.sc.C}/${g.max.C}) · Mulai ${fmtDate(r.mulai)} · Selesai ${fmtDate(r.selesai)} · Keluar halaman ${r.pelanggaran.keluar}× · Kode ${esc(r.kode)} ${r._valid ? '<span class="tag ok">valid</span>' : '<span class="tag no">file diubah</span>'}</p>
    <p style="font-size:14px;color:var(--muted)">Nomor soal di bawah mengikuti bank soal (A1–A20, B1–B10, C1–C6), bukan urutan acak yang dilihat siswa.</p>
    <div class="det">${rows}</div>
    <div class="row"><button class="btn btn-primary" id="c">Tutup</button></div>`, true);
  $('#c').addEventListener('click', closeSheet);
}
function exportCSV() {
  const L = filtered(); if (!L.length) { toast('Belum ada data untuk diunduh.'); return; }
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const head = ['No', 'Nama', 'Kelas', 'Absen', 'Skor A', 'Skor B', 'Skor C', 'Nilai', 'Status', 'Keluar halaman', 'Tempel', 'Waktu habis', 'File valid', 'Mulai', 'Selesai', ...Q.map(x => x.id)];
  const lines = ['sep=;', head.map(q).join(';')];
  L.forEach((r, i) => { const g = r._g; lines.push([i + 1, r.siswa.nama, r.siswa.kelas, r.siswa.absen, g.sc.A, g.sc.B, g.sc.C, g.nilai, g.nilai >= CFG.kkm ? 'Tuntas' : 'Belum tuntas', r.pelanggaran.keluar, r.pelanggaran.tempel, r.otomatis ? 'Ya' : 'Tidak', r._valid ? 'Ya' : 'Tidak', fmtDate(r.mulai), fmtDate(r.selesai), ...Q.map(x => g.det[x.id].pts)].map(q).join(';')); });
  saveFile(`Rekap_Nilai_Perulangan_${T.kelas.replace(/\s+/g, '-')}.csv`, lines.join('\r\n'));
}

/* ---------- dialog ---------- */
let lastFocus = null;
function openSheet(html, wide) { lastFocus = document.activeElement; $('#sheet-card').className = 'card' + (wide ? ' wide' : ''); $('#sheet-card').innerHTML = html; $('#sheet').classList.remove('hide'); $('#sheet').setAttribute('aria-labelledby', 'sh-t'); const card = $('#sheet-card'); card.scrollTop = 0; if (wide) { card.setAttribute('tabindex', '-1'); card.focus(); return; } const b = card.querySelector('button'); if (b && !$('#pin')) b.focus(); }
function closeSheet() { $('#sheet').classList.add('hide'); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').classList.contains('hide')) closeSheet(); });
function confirmSheet(title, body, okLabel, onOk, danger) {
  openSheet(`<h3 id="sh-t">${title}</h3><p>${body}</p><div class="row"><button class="btn btn-line" id="c">Batal</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="o">${okLabel}</button></div>`);
  $('#c').addEventListener('click', closeSheet); $('#o').addEventListener('click', () => { closeSheet(); onOk(); });
}
window.addEventListener('beforeunload', () => { if (S && !S.done) saveCurrent(); });

renderLogin();
})();
</script>
